<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#245c49" />
    <meta
      name="description"
      content="Prototype điện thoại Kèo: chụp ảnh, hẹn bạn bè, trò chuyện và nhìn lại kỷ niệm."
    />
    <title>Kèo · Prototype điện thoại</title>
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body>
    <header class="preview-header">
      <a class="preview-brand" href="index.html">kèo<span>.</span></a>
      <nav aria-label="Chọn kích thước điện thoại">
        <button
          type="button"
          data-width="375"
          data-height="812"
          aria-pressed="false"
        >
          375 × 812
        </button>
        <button
          type="button"
          data-width="390"
          data-height="844"
          class="active"
          aria-pressed="true"
        >
          390 × 844
        </button>
        <button
          type="button"
          data-width="430"
          data-height="932"
          aria-pressed="false"
        >
          430 × 932
        </button>
      </nav>
      <span class="preview-tag">Mobile prototype</span>
    </header>
    <div class="preview-workspace">
      <aside class="screen-catalog" aria-label="Danh mục màn hình">
        <div class="catalog-heading">
          <h2>Toàn bộ màn hình</h2>
          <span id="screenCount"></span>
        </div>
        <p>
          Mỗi mục mở một màn hoặc sheet mẫu. Dữ liệu minh họa tách khỏi phần
          trải nghiệm tự do.
        </p>
        <label class="catalog-search"
          ><span>Tìm màn hình</span
          ><input
            id="screenSearch"
            type="search"
            placeholder="Tên màn hình, chức năng…"
        /></label>
        <button id="freePreview" class="free-preview" type="button">
          Trải nghiệm tự do
        </button>
        <nav id="screenList" aria-label="Các màn hình và sheet"></nav>
        <p id="screenEmpty" hidden>Không có màn hình phù hợp.</p>
      </aside>
      <div class="preview-stage" id="previewStage">
        <div class="phone-wrap" id="phoneWrap">
          <div class="phone" id="phoneFrame">
            <iframe
              src="app.html?preview=1"
              title="Prototype ứng dụng Kèo trên điện thoại"
              allow="camera; fullscreen"
            ></iframe>
          </div>
        </div>
      </div>
    </div>
    <footer class="preview-footer">
      Home để chụp. Kèo để hẹn. Tin nhắn để trò chuyện. Thời gian để nhớ.<span
        >Dữ liệu mẫu · lưu cục bộ</span
      >
    </footer>
    <script src="screens.js"></script>
    <script src="preview.js"></script>
  </body>
</html>
