<!doctype html>
<html lang="vi">
  <meta charset="utf-8" />
  <title>Kiểm chứng viền điện thoại và danh mục</title>
  <style>
    body {
      margin: 0;
      font: 13px/1.5 system-ui;
    }
    iframe {
      display: block;
      width: 1280px;
      height: 950px;
      border: 0;
    }
    pre {
      white-space: pre-wrap;
    }
  </style>
  <iframe id="preview" src="../dist/index.html?screen=home" title="Preview kiểm thử"></iframe>
  <pre id="results">Đang kiểm tra…</pre>
  <script>
    (async () => {
      const frame = document.getElementById('preview'),
        out = document.getElementById('results'),
        checks = [];
      const check = (name, pass) => checks.push({ name, pass: Boolean(pass) });
      try {
        await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
        const doc = frame.contentDocument,
          win = frame.contentWindow,
          appFrame = doc.querySelector('#phoneFrame iframe');
        const loaded = () =>
          new Promise((resolve) => appFrame.addEventListener('load', resolve, { once: true }));
        if (!appFrame.contentWindow.KeoPrototype) await loaded();
        check(
          'Có viền điện thoại thật',
          win.getComputedStyle(doc.querySelector('#phoneFrame')).borderTopWidth === '10px',
        );
        check(
          'Liệt kê đủ toàn bộ màn hình',
          doc.querySelectorAll('#screenList [data-screen]').length === win.KeoScreens.length,
        );
        check('Danh mục mặc định dùng dữ liệu riêng', appFrame.src.includes('catalog=1'));
        const search = doc.querySelector('#screenSearch');
        search.value = 'binh chon';
        search.dispatchEvent(new win.Event('input', { bubbles: true }));
        check(
          'Tìm tiếng Việt không dấu',
          [...doc.querySelectorAll('#screenList [data-screen]')].some(
            (el) => el.dataset.screen === 'ideas',
          ),
        );
        let ready = loaded();
        doc.querySelector('[data-screen="ideas"]').click();
        await ready;
        check(
          'Bấm danh mục mở đúng Đề xuất',
          appFrame.contentWindow.KeoPrototype.getView().planPanel === 'ideas',
        );
        check(
          'Giữ deep link màn hình',
          new URL(win.location.href).searchParams.get('screen') === 'ideas',
        );
        doc.querySelector('[data-width="430"]').click();
        check(
          'Đổi kích thước giữ viewport 430×932',
          appFrame.contentWindow.innerWidth === 430 && appFrame.contentWindow.innerHeight === 932,
        );
        const phone = doc.querySelector('#phoneWrap').getBoundingClientRect(),
          stage = doc.querySelector('#previewStage').getBoundingClientRect();
        check(
          'Khung điện thoại nằm trong vùng preview',
          phone.left >= stage.left &&
            phone.right <= stage.right &&
            phone.top >= stage.top &&
            phone.bottom <= stage.bottom,
        );
        search.value = 'mã';
        search.dispatchEvent(new win.Event('input', { bubbles: true }));
        ready = loaded();
        doc.querySelector('[data-screen="room-join"]').click();
        await ready;
        check(
          'Danh mục mở được sheet',
          appFrame.contentDocument.querySelector('#modal').open &&
            Boolean(appFrame.contentDocument.querySelector('[data-form="join-room"]')),
        );
        ready = loaded();
        doc.querySelector('#freePreview').click();
        await ready;
        check(
          'Trải nghiệm tự do ra khỏi dữ liệu mẫu màn hình',
          !appFrame.src.includes('catalog=1') &&
            !new URL(win.location.href).searchParams.has('screen'),
        );
        const result = {
          passed: checks.filter((c) => c.pass).length,
          failed: checks.filter((c) => !c.pass).length,
          checks,
        };
        out.textContent = JSON.stringify(result, null, 2);
        out.dataset.status = result.failed ? 'FAIL' : 'PASS';
      } catch (error) {
        out.textContent = 'FAIL: ' + error.stack;
        out.dataset.status = 'FAIL';
      }
    })();
  </script>
</html>
