<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img">
<title>Project structure of the five Gradle modules</title>
<rect width="1600" height="1080" fill="#F5F7FB"/>
<text x="70" y="55.5" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#087F8C">KOTLIN MVVM BASE / 01</text>
<text x="70" y="123.5" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="44" font-weight="600" fill="#152B42">Project structure</text>
<text x="70" y="164.0" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#56667A">Five Gradle modules, organized by layer. Screens stay in app/ui.</text>
<rect x="70" y="210" width="700" height="790" rx="20" fill="#FFFFFF" stroke="#DCE3ED" stroke-width="1.5"/>
<text x="107" y="279.5" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="600" fill="#087F8C">:app</text>
<text x="107" y="319.0" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#56667A">Android application / composition root</text>
<text x="107" y="384.0" text-anchor="start" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="25" font-weight="400" fill="#152B42">src/main/java/com/example/base/</text>
<text x="107" y="427.0" text-anchor="start" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="25" font-weight="400" fill="#152B42">├─ di/           Hilt providers</text>
<text x="107" y="470.0" text-anchor="start" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="25" font-weight="400" fill="#152B42">├─ navigation/   Routes + NavHost</text>
<text x="107" y="513.0" text-anchor="start" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="25" font-weight="400" fill="#152B42">├─ session/      DataStore adapter</text>
<text x="107" y="556.0" text-anchor="start" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="25" font-weight="400" fill="#152B42">├─ ui/</text>
<text x="107" y="599.0" text-anchor="start" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="25" font-weight="400" fill="#152B42">│  ├─ base/      State + effects</text>
<text x="107" y="642.0" text-anchor="start" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="25" font-weight="400" fill="#152B42">│  ├─ todo/      Screen + ViewModel</text>
<text x="107" y="685.0" text-anchor="start" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="25" font-weight="400" fill="#152B42">│  └─ users/     Screen + ViewModel</text>
<text x="107" y="728.0" text-anchor="start" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="25" font-weight="400" fill="#152B42">├─ MainActivity.kt</text>
<text x="107" y="771.0" text-anchor="start" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="25" font-weight="400" fill="#152B42">└─ MainApplication.kt</text>
<text x="107" y="814.0" text-anchor="start" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="25" font-weight="400" fill="#152B42"></text>
<text x="107" y="857.0" text-anchor="start" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="25" font-weight="400" fill="#152B42">src/test/       JVM + Robolectric</text>
<rect x="820" y="210" width="710" height="230" rx="20" fill="#FFFFFF" stroke="#DCE3ED" stroke-width="1.5"/>
<text x="857" y="276.5" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="600" fill="#7354B6">:domain</text>
<text x="857" y="316.0" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#56667A">Kotlin/JVM / business contracts</text>
<text x="857" y="362.0" text-anchor="start" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="25" font-weight="400" fill="#152B42">model/    repository/    session/</text>
<text x="857" y="401.0" text-anchor="start" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="25" font-weight="400" fill="#152B42">usecase/  usecase/base/</text>
<rect x="820" y="470" width="710" height="230" rx="20" fill="#FFFFFF" stroke="#DCE3ED" stroke-width="1.5"/>
<text x="857" y="536.5" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="600" fill="#7354B6">:data</text>
<text x="857" y="576.0" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#56667A">Kotlin/JVM / implementations</text>
<text x="857" y="622.0" text-anchor="start" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="25" font-weight="400" fill="#152B42">api/  datasource/  mapper/</text>
<text x="857" y="661.0" text-anchor="start" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="25" font-weight="400" fill="#152B42">model/  repository/</text>
<rect x="820" y="730" width="710" height="120" rx="20" fill="#FFFFFF" stroke="#DCE3ED" stroke-width="1.5"/>
<text x="857" y="781.0" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="600" fill="#315FC4">:shared</text>
<text x="857" y="826.0" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#56667A">Result, errors, retry, logging, dispatchers</text>
<rect x="820" y="880" width="710" height="120" rx="20" fill="#FFFFFF" stroke="#DCE3ED" stroke-width="1.5"/>
<text x="857" y="931.0" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="600" fill="#315FC4">:resources</text>
<text x="857" y="976.0" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#56667A">Android library / theme, colors, strings</text>
<text x="70" y="1058.0" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#56667A">Each module owns its build script and source set. Hilt wiring lives in app/di.</text>
</svg>
