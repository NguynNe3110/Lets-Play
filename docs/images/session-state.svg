<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img">
<title>Session loading, ready, error and retry transitions</title>
<rect width="1600" height="820" fill="#F5F7FB"/>
<text x="70" y="55.5" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#087F8C">KOTLIN MVVM BASE / 04</text>
<text x="70" y="123.5" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="44" font-weight="600" fill="#152B42">Session-driven startup</text>
<text x="70" y="164.0" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#56667A">The app observes one SessionState instead of running a startup task framework.</text>
<polyline points="1230,340 1230,225 275,225 275,340" fill="none" stroke="#315FC4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="275,340 268.49174391323663,326.48546698146373 281.50825608676337,326.48546698146373" fill="#315FC4"/>
<text x="605" y="212.0" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#315FC4">Retry → restart collection</text>
<polyline points="450,395 625,395" fill="none" stroke="#087F8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="625,395 611.4854669814637,401.50825608676337 611.4854669814637,388.49174391323663" fill="#087F8C"/>
<text x="475" y="375.0" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#087F8C">Read OK</text>
<polyline points="975,395 1150,395" fill="none" stroke="#7354B6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="1150,395 1136.4854669814638,401.50825608676337 1136.4854669814638,388.49174391323663" fill="#7354B6"/>
<text x="994" y="374.0" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#7354B6">Read error</text>
<polyline points="275,465 275,605 1325,605 1325,465" fill="none" stroke="#7354B6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="1325,465 1331.5082560867634,478.51453301853627 1318.4917439132366,478.51453301853627" fill="#7354B6"/>
<text x="665" y="592.0" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#7354B6">Initial read failure</text>
<rect x="100" y="340" width="350" height="125" rx="20" fill="#E7F4F3" stroke="#DCE3ED" stroke-width="1.5"/>
<text x="275.0" y="389.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="600" fill="#087F8C">Loading</text>
<text x="275.0" y="428.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#56667A">Show progress</text>
<rect x="625" y="340" width="350" height="125" rx="20" fill="#E7F4F3" stroke="#DCE3ED" stroke-width="1.5"/>
<text x="800.0" y="389.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="600" fill="#087F8C">Ready</text>
<text x="800.0" y="428.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#56667A">Session + expiration flag</text>
<rect x="1150" y="340" width="350" height="125" rx="20" fill="#F0EBFA" stroke="#DCE3ED" stroke-width="1.5"/>
<text x="1325.0" y="389.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="600" fill="#7354B6">Error</text>
<text x="1325.0" y="428.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#56667A">Show Retry</text>
<rect x="70" y="670" width="1460" height="100" rx="20" fill="#FFFFFF" stroke="#DCE3ED" stroke-width="1.5"/>
<text x="105" y="716.0" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#152B42">A read failure also wakes waiting save / clear / expire calls with the error.</text>
<text x="105" y="754.0" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#56667A">Expiration is persistent session state; it does not depend on a snackbar collector.</text>
</svg>
