name: LetsPlay CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Verify Architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Module Boundaries
        run: ./gradlew verifyModuleBoundaries

      - name: Run Core JVM Unit Tests
        run: ./gradlew :domain:test :data:test :shared:test

      - name: Run App Unit Tests (Dev & Prod)
        run: ./gradlew :app:testDevDebugUnitTest :app:testProdDebugUnitTest

      - name: Assemble APKs (DevDebug & ProdDebug)
        run: ./gradlew :app:assembleDevDebug :app:assembleProdDebug

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            domain/build/reports/tests/
            data/build/reports/tests/
            shared/build/reports/tests/
            app/build/reports/tests/
          retention-days: 7
